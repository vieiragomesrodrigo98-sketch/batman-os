[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batman-os"
version = "0.1.0"
description = "Batman OS — Sistema Operacional Cognitivo Determinístico"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "anthropic>=0.40",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.9",
    "ruff>=0.4",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]
local-llm = [
    "llama-cpp-python>=0.3",
]
observe = [
    # Coleta de infra/portas/processos. Dependencia OPCIONAL (como
    # `llama-cpp-python` e do `local-llm`): o subsistema `observe` funciona
    # com collectors injetados e so exige psutil para a coleta real na VPS.
    # O EndpointCollector usa `urllib` (stdlib) — sem dependencia nova.
    "psutil>=5.9",
]

[project.scripts]
batman = "batman_os.cli.batman:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "llama_cpp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psutil.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
