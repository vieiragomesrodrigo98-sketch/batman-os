name: CI

# A branch deste repositorio e `master`, mas o gatilho so escutava `main` — o
# workflow nunca rodou uma unica vez desde que foi escrito. Escutar as duas
# (mesmo padrao do ci.yml do radar-preditivo) evita depender de qual nome a
# branch tem em cada copia, incluindo a que vive na VPS.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: mypy
        run: mypy src/ tests/

      - name: ruff check
        run: ruff check src/ tests/

      - name: ruff format --check
        run: ruff format --check src/ tests/
